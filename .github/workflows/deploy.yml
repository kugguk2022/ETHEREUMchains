name: Build
on:
  push:
    branches: [ master ]

permissions:
  contents: read

# Serialize the full build/deploy sequence so publications cannot overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build
        run: |
          ./gradlew run
      - name: Set Node.js 18.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 18.x
      - name: Run yarn install
        uses: borales/actions-yarn@v5
        with:
          dir: 'website'
          cmd: install
      - name: Run yarn build
        uses: borales/actions-yarn@v5
        with:
          dir: 'website'
          cmd: run build
      - name: Merge
        run: |
          cp -a output/. website/public/
      - name: Verify deployment output
        run: |
          test -s website/public/chains.json
          test -s website/public/chains_mini.json
      - name: Upload deployment output
        uses: actions/upload-artifact@v4
        with:
          name: chainlist-site
          path: website/public/
          if-no-files-found: error
          # Preserve public site files such as .nojekyll.
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download deployment output
        uses: actions/download-artifact@v4
        with:
          name: chainlist-site
          path: website/public/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: website/public
